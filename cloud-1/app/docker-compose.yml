name: cloud1

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:6.8-php8.3-fpm-alpine
    container_name: wordpress
    restart: unless-stopped
    environment: &wp_db_env
      WORDPRESS_DB_HOST: ${DB_HOST}:${DB_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wordpress_volume:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      retries: 20

  wpcli:
    image: wordpress:cli-php8.3
    profiles:
      - setup
    restart: "no"
    environment:
      <<: *wp_db_env
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_SUPER_USER: ${WP_SUPER_USER}
      WP_SUPER_PASSWORD: ${WP_SUPER_PASSWORD}
      WP_SUPER_EMAIL: ${WP_SUPER_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_PASSWORD: ${WP_USER_PASSWORD}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    volumes:
      - wordpress_volume:/var/www/html
      - ./wordpress/wp-setup.sh:/usr/local/bin/wp-setup.sh:ro
    networks:
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/wp-setup.sh"]

  phpmyadmin:
    image: phpmyadmin:5.2.3-fpm-alpine
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_ABSOLUTE_URI: https://${DOMAIN_NAME}/phpmyadmin/
    volumes:
      - phpmyadmin_files:/var/www/html
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
    
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - wordpress_volume:/var/www/html:ro
      - phpmyadmin_files:/var/www/phpmyadmin:ro
    networks:
      - frontend
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_started

networks:
  frontend:
  backend:
    internal: true

volumes:
  mariadb_volume:
  wordpress_volume:
  phpmyadmin_files:
