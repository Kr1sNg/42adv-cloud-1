---
- name: Create folder Project
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create folder for web
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1/data/web"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create folder for database
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1/data/database"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy folder app to vm
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/app"
    dest: "/home/{{ ansible_user }}/cloud-1"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    directory_mode: "0755"
