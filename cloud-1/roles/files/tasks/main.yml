---
- name: Create app directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy /app directory to vm
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/app"
    dest: "/home/{{ ansible_user }}/cloud-1"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Generate dotenv file from Vault
  ansible.builtin.template:
    src: "/home/{{ ansible_user }}/cloud-1/app/.env.j2"
    dest: "/home/{{ ansible_user }}/cloud-1/app/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create folder for web
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1/data/web"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create folder for database
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/cloud-1/data/database"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
