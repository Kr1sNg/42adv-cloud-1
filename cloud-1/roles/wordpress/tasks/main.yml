---
- name: Deploy WordPress
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services:
      - wordpress
    state: present
    wait: true  # wait until the healthcheck pass
    wait_timeout: 120

- name: Install wpcli and create users (wp-cli, only once)
  ansible.builtin.command:
    cmd: docker compose run --rm wpcli  # delete container as soon as script finishes
    chdir: "{{ app_dir }}"
  register: wpcli_result
  changed_when: >-
    'Installing' in wpcli_result.stdout or
    'Creating' in wpcli_result.stdout
