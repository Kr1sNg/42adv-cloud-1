---
- name: Install docker & docker-compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Ensure Docker services is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group to use Docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - docker
    append: true
